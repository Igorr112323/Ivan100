# АКВАЧЕК: раздача готового статического экрана.
# Кладём в /etc/nginx/sites-available/default, затем: sudo nginx -t && sudo systemctl reload nginx
#
# ВАЖНО: здесь намеренно НЕТ limit_conn / limit_req / auth_basic / deny / geo.
# 10-20 заходов из-под одного NAT (общий Wi-Fi зала) должны все вернуть 200.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/akvachek;
    index akvachek.html;          # корень сразу открывает экран, QR получается коротким

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 8m;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json
               application/pdf image/svg+xml;

    access_log /var/log/nginx/akvachek.access.log;

    # Query string (?limit=70) nginx не трогает: deep link работает без доп. правил.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";   # пока идёт подготовка к защите
    }

    location ~* \.(png|jpg|jpeg|pdf)$ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Закомментировано специально — НЕ включать:
    # limit_conn_zone $binary_remote_addr zone=perip:10m;
    # limit_conn perip 10;
    # limit_req zone=... burst=...;
    # auth_basic "closed site";
}

# После `certbot --nginx -d <домен>` certbot сам добавит server { listen 443 ssl; ... }.
# Проверка: curl -I http://<IP>/akvachek.html  ->  200
#           20 параллельных заходов с одного IP -> все 200, в error.log нет 429/503.
