name: fetch-data

# Пайплайн добычи РЕАЛЬНЫХ данных проекта «АКВАЧЕК».
# Источники: Sentinel-2 L2A (Copernicus/ESA, публичные COG на AWS Open Data),
# ERA5 (ECMWF) через Historical Weather API, Copernicus DEM GLO-30 (AWS Open Data).
# Раннер скачивает данные и коммитит их в data/. Синтетических значений нет:
# если источник недоступен, пайплайн завершается ошибкой.

on:
  push:
    branches: ["**"]
    paths:
      - "pipeline/**"
      - ".github/workflows/fetch-data.yml"
  workflow_dispatch:
    inputs:
      years:
        description: "Годы метеоряда ERA5 (через запятую)"
        required: false
        default: "2020,2024,2025"
      steps:
        description: "Что выполнить: all | era5 | sentinel | checks"
        required: false
        default: "all"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Зависимости пайплайна
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt

      - name: Метеоряд ERA5
        if: ${{ (github.event.inputs.steps || 'all') == 'all' || github.event.inputs.steps == 'era5' }}
        working-directory: pipeline
        run: python fetch_era5.py --years "${{ github.event.inputs.years || '2020,2024,2025' }}"

      - name: Снимки Sentinel-2
        if: ${{ (github.event.inputs.steps || 'all') == 'all' || github.event.inputs.steps == 'sentinel' }}
        working-directory: pipeline
        run: python fetch_sentinel.py

      - name: Фиксация метеоряда
        run: |
          git config user.name "akvachek-pipeline"
          git config user.email "pipeline@akvachek.local"
          git add -A data web/public/data
          git diff --cached --quiet || git commit -m "data: метеоряд ERA5 [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin HEAD:"${GITHUB_REF_NAME}" || true

      - name: Контуры и характеристики чеков
        if: ${{ (github.event.inputs.steps || 'all') == 'all' || github.event.inputs.steps == 'checks' }}
        working-directory: pipeline
        run: python build_checks.py

      - name: Что получилось
        run: |
          echo "=== data ==="
          find data -type f | sort | head -60
          echo "=== размеры ==="
          du -sh data/* 2>/dev/null || true
          if [ -f data/checks.geojson ]; then
            python - <<'PY'
          import json
          g = json.load(open("data/checks.geojson", encoding="utf-8"))
          m = g.get("metadata", {})
          print("чеков:", m.get("count"), "| площадь, га:", m.get("total_ha"), "| ср. отметка:", m.get("mean_elev_m"))
          PY
          fi

      - name: Фиксация результатов
        run: |
          git config user.name "akvachek-pipeline"
          git config user.email "pipeline@akvachek.local"
          git add -A data web/public/data
          if git diff --cached --quiet; then
            echo "новых данных нет"
          else
            git commit -m "data: реальные данные Sentinel-2 / ERA5 / Copernicus DEM [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
