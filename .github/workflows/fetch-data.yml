name: fetch-data

on:
  push:
    branches: ["**"]
    paths:
      - "pipeline/**"
      - ".github/workflows/fetch-data.yml"
  workflow_dispatch:
    inputs:
      steps:
        description: "all | weather | imagery | checks"
        required: false
        default: "all"
      years:
        description: "Годы метеоряда"
        required: false
        default: "2020,2024,2025"

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
      issues: write
    env:
      STEPS: ${{ github.event.inputs.steps || 'all' }}
      YEARS: ${{ github.event.inputs.years || '2020,2024,2025' }}
    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Зависимости пайплайна
        run: pip install -r pipeline/requirements.txt

      - name: Метеоряд ERA5
        continue-on-error: true
        working-directory: pipeline
        run: |
          mkdir -p ../data/_log
          python fetch_era5.py --years "$YEARS" 2>&1 | tee ../data/_log/weather.txt


      - name: Фиксация метеоряда
        if: always()
        run: |
          set +e
          git config user.name "akvachek-pipeline"
          git config user.email "pipeline@akvachek.local"
          git add -A data || echo "add data: $?"
          if [ -d web/public/data ]; then git add -A web/public/data || echo "add web: $?"; fi
          echo "staged: $(git diff --cached --name-only | wc -l)"
          if git diff --cached --quiet; then
            echo "нет изменений"
          else
            git commit -q -m "data: метеоряд ERA5 [skip ci]" && echo "commit ok" || echo "commit FAIL $?"
            for i in 1 2 3; do
              git pull --rebase origin "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
              sleep 5
            done
            git push origin HEAD:"$GITHUB_REF_NAME" && echo "push ok" || echo "push FAIL $?"
          fi

      - name: Снимки Sentinel-2
        if: ${{ env.STEPS == 'all' || env.STEPS == 'imagery' }}
        continue-on-error: true
        working-directory: pipeline
        run: |
          mkdir -p ../data/_log
          python fetch_sentinel.py 2>&1 | tee ../data/_log/imagery.txt


      - name: Фиксация снимков
        if: always()
        run: |
          set +e
          git config user.name "akvachek-pipeline"
          git config user.email "pipeline@akvachek.local"
          git add -A data || echo "add data: $?"
          if [ -d web/public/data ]; then git add -A web/public/data || echo "add web: $?"; fi
          echo "staged: $(git diff --cached --name-only | wc -l)"
          if git diff --cached --quiet; then
            echo "нет изменений"
          else
            git commit -q -m "data: снимки Sentinel-2 [skip ci]" && echo "commit ok" || echo "commit FAIL $?"
            for i in 1 2 3; do
              git pull --rebase origin "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
              sleep 5
            done
            git push origin HEAD:"$GITHUB_REF_NAME" && echo "push ok" || echo "push FAIL $?"
          fi

      - name: Контуры и характеристики чеков
        if: ${{ env.STEPS == 'all' || env.STEPS == 'checks' }}
        continue-on-error: true
        working-directory: pipeline
        run: |
          mkdir -p ../data/_log
          python build_checks.py 2>&1 | tee ../data/_log/checks.txt


      - name: Фиксация чеков
        if: always()
        run: |
          set +e
          git config user.name "akvachek-pipeline"
          git config user.email "pipeline@akvachek.local"
          git add -A data || echo "add data: $?"
          if [ -d web/public/data ]; then git add -A web/public/data || echo "add web: $?"; fi
          echo "staged: $(git diff --cached --name-only | wc -l)"
          if git diff --cached --quiet; then
            echo "нет изменений"
          else
            git commit -q -m "data: контуры чеков [skip ci]" && echo "commit ok" || echo "commit FAIL $?"
            for i in 1 2 3; do
              git pull --rebase origin "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
              sleep 5
            done
            git push origin HEAD:"$GITHUB_REF_NAME" && echo "push ok" || echo "push FAIL $?"
          fi

      - name: Что получилось
        run: |
          echo "--- структура data/ ---"
          find data -type f | sort | head -40
          echo "--- сводка ---"
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path("data")
          for name in ("checks.geojson", "scenes.json", "weather/manifest.json"):
              p = root / name
              if not p.exists():
                  print(name, "— нет")
                  continue
              j = json.loads(p.read_text(encoding="utf-8"))
              if name.endswith("geojson"):
                  print(f"чеков: {len(j['features'])}")
              else:
                  print(name, "—", json.dumps(j, ensure_ascii=False)[:400])
          PY

      - name: Журнал в задачу
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          {
            echo "### Прогон $GITHUB_RUN_ID ($GITHUB_RUN_NUMBER)"
            echo "ветка: $GITHUB_REF_NAME, событие: $GITHUB_EVENT_NAME, время: $(date -u +%FT%TZ)"
            echo ""
            echo "#### Файлы в data/"
            find data -type f | sort | head -40
            echo ""
            for f in weather imagery checks; do
              echo "#### Шаг $f (последние 40 строк)"
              tail -40 "data/_log/$f.txt" 2>/dev/null || echo "нет журнала"
              echo ""
            done
            echo "#### Git"
            echo "staged: $(git status --porcelain | wc -l)"
            git log --oneline -3
          } > /tmp/report.md
          wc -c /tmp/report.md
          gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body-file /tmp/report.md \
            && echo "журнал отправлен" || echo "issue FAIL $?"
