name: proof

# Отдельный прогон: доказательство риса не должно перезапускать весь пайплайн.
on:
  push:
    branches: ["**"]
    paths:
      - "pipeline/rice_proof.py"
      - "pipeline/verify_checks.py"
      - "pipeline/fetch_sentinel.py"
      - "pipeline/common.py"
      - "pipeline/requirements.txt"
      - ".github/workflows/proof.yml"
      - "data/_trigger/proof.txt"
  workflow_dispatch:

# Все три воркфлоу коммитят data/ — одновременные прогоны теряли данные на пуше.
concurrency:
  group: akvachek-data
  cancel-in-progress: false

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
      issues: write
    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Зависимости
        run: pip install -r pipeline/requirements.txt

      - name: Доказательство риса
        working-directory: pipeline
        run: |
          mkdir -p ../data/_log
          python rice_proof.py 2>&1 | tee ../data/_log/rice_proof.txt

      - name: Фиксация результата
        if: always()
        run: |
          set +e
          git config user.name "akvachek-pipeline"
          git config user.email "pipeline@akvachek.local"
          git add -A data
          if git diff --cached --quiet; then
            echo "нет изменений"
          else
            git commit -q -m "данные: доказательство риса по июньскому снимку [skip ci]" || echo "commit FAIL"
            for i in 1 2 3; do
              git pull --rebase origin "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
              sleep 5
            done
            git push origin HEAD:"$GITHUB_REF_NAME" && echo "push ok" || echo "push FAIL"
          fi

      - name: Журнал в задачу
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          {
            echo "### Доказательство риса, прогон $GITHUB_RUN_ID"
            echo ""
            echo '```'
            tail -60 data/_log/rice_proof.txt 2>/dev/null || echo "нет журнала"
            echo '```'
          } > /tmp/report.md
          gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body-file /tmp/report.md || echo "issue FAIL"
