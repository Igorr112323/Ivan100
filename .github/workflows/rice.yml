name: rice

on:
  push:
    branches: ["**"]
    paths:
      - "pipeline/build_checks.py"
      - "pipeline/fetch_sentinel.py"
      - "pipeline/fetch_era5.py"
      - "pipeline/verify_checks.py"
      - "pipeline/common.py"
      - "pipeline/requirements.txt"
      - ".github/workflows/rice.yml"
      - "data/_trigger/*.txt"
  workflow_dispatch:
    inputs:
      stage:
        description: "all | scan | pipe | weather | imagery | checks | verify | diag"
        required: false
        default: "all"

# Все три воркфлоу коммитят data/ — одновременные прогоны теряли данные на пуше.
concurrency:
  group: akvachek-data
  cancel-in-progress: false

jobs:
  rice:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
      issues: write
    env:
      STAGE: ${{ github.event.inputs.stage || 'all' }}
      YEARS: "2020,2024,2025"
    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Зависимости пайплайна
        run: pip install -r pipeline/requirements.txt

      - name: Поиск рисового массива
        if: ${{ env.STAGE == 'all' || env.STAGE == 'scan' }}
        working-directory: pipeline
        run: |
          mkdir -p ../data/_log
          set +e
          PICK=$(grep -m1 '^PICK=' ../data/_trigger/rice.txt 2>/dev/null | cut -d= -f2 | tr -d ' \r')
          case "$PICK" in ''|*[!0-9]*) PICK=0 ;; esac
          echo "массив №$((PICK + 1)): AOI_PICK=$PICK"
          COVER=$(grep -m1 '^COVER=' ../data/_trigger/rice.txt 2>/dev/null | cut -d= -f2 | tr -d ' \r')
          case "$COVER" in ''|*[!0-9.]*) COVER=0.95 ;; esac
          echo "покрытие не менее $COVER"
          AOI_PICK="$PICK" COVER_MIN="$COVER" python find_rice.py > ../data/_log/find_rice.txt 2>&1
          echo "КОД ВЫХОДА: $?" >> ../data/_log/find_rice.txt
          tail -40 ../data/_log/find_rice.txt

      - name: Метеоряд ERA5 для нового полигона
        if: ${{ env.STAGE == 'all' || env.STAGE == 'pipe' || env.STAGE == 'weather' }}
        working-directory: pipeline
        run: |
          mkdir -p ../data/_log
          set +e
          python fetch_era5.py --years "$YEARS" > ../data/_log/weather.txt 2>&1
          echo "КОД ВЫХОДА: $?" >> ../data/_log/weather.txt
          tail -40 ../data/_log/weather.txt

      - name: Снимки Sentinel-2
        if: ${{ env.STAGE == 'all' || env.STAGE == 'pipe' || env.STAGE == 'imagery' }}
        working-directory: pipeline
        run: |
          mkdir -p ../data/_log
          set +e
          python fetch_sentinel.py > ../data/_log/imagery.txt 2>&1
          echo "КОД ВЫХОДА: $?" >> ../data/_log/imagery.txt
          tail -40 ../data/_log/imagery.txt

      - name: Диагностика признака затопления
        if: ${{ env.STAGE == 'all' || env.STAGE == 'pipe' || env.STAGE == 'checks' || env.STAGE == 'diag' }}
        working-directory: pipeline
        run: |
          mkdir -p ../data/_log
          set +e
          python diag_flood.py > ../data/_log/diag.txt 2>&1
          echo "КОД ВЫХОДА: $?" >> ../data/_log/diag.txt
          tail -60 ../data/_log/diag.txt
          exit 0

      - name: Контуры чеков с отбором по признаку риса
        if: ${{ env.STAGE == 'all' || env.STAGE == 'pipe' || env.STAGE == 'checks' }}
        working-directory: pipeline
        run: |
          mkdir -p ../data/_log
          set +e
          python build_checks.py > ../data/_log/checks.txt 2>&1
          echo "КОД ВЫХОДА: $?" >> ../data/_log/checks.txt
          tail -40 ../data/_log/checks.txt

      - name: Визуальная проверка пяти случайных чеков
        if: ${{ env.STAGE == 'all' || env.STAGE == 'pipe' || env.STAGE == 'verify' }}
        working-directory: pipeline
        run: |
          mkdir -p ../data/_log
          set +e
          python verify_checks.py > ../data/_log/verify.txt 2>&1
          echo "КОД ВЫХОДА: $?" >> ../data/_log/verify.txt
          tail -40 ../data/_log/verify.txt

      - name: Контрольный массив — копия под своим номером
        run: |
          set +e
          PICK=$(grep -m1 '^PICK=' data/_trigger/rice.txt 2>/dev/null | cut -d= -f2 | tr -d ' \r')
          case "$PICK" in ''|*[!0-9]*) PICK=0 ;; esac
          if [ "$PICK" = "0" ]; then echo "основной массив: копию не делаем"; exit 0; fi
          case "$PICK" in
            1) SLOT=b ;;
            2) SLOT=c ;;
            *) SLOT="s$PICK" ;;
          esac
          echo "слот: $SLOT"
          [ -f data/checks.geojson ] && cp data/checks.geojson "data/checks_$SLOT.geojson"
          [ -f data/checks_series.json ] && cp data/checks_series.json "data/checks_series_$SLOT.json"
          [ -f data/aoi.json ] && cp data/aoi.json "data/aoi_$SLOT.json"
          # метеоряд своего массива: иначе контрольный массив считается по чужой погоде
          for y in 2020 2024 2025; do
            [ -f "data/weather/era5_daily_$y.csv" ] && \
              cp "data/weather/era5_daily_$y.csv" "data/weather/era5_daily_${y}_$SLOT.csv"
          done
          for f in checks find_rice imagery verify diag weather; do
            [ -f "data/_log/$f.txt" ] && cp "data/_log/$f.txt" "data/_log/${f}_$SLOT.txt"
          done
          # основной массив возвращаем как был: контрольный прогон его не меняет
          git checkout -- data/checks.geojson data/checks_series.json data/aoi.json \
            data/rice_proof.json data/sentinel data/verify data/weather 2>/dev/null
          echo "восстановлен основной массив, журналы контрольного — в data/_log/*_$SLOT.txt"

      - name: Фиксация данных
        if: always()
        run: |
          set +e
          git config user.name "akvachek-pipeline"
          git config user.email "pipeline@akvachek.local"
          git add -A data web/public/data
          echo "staged: $(git diff --cached --name-only | wc -l)"
          if git diff --cached --quiet; then
            echo "нет изменений"
          else
            git commit -q -m "data: рисовый массив Красноармейского района [skip ci]" && echo "commit ok" || echo "commit FAIL $?"
            for i in 1 2 3 4 5; do
              git fetch -q origin "$GITHUB_REF_NAME"
              git rebase -X theirs "origin/$GITHUB_REF_NAME" >/dev/null 2>&1 || git rebase --abort >/dev/null 2>&1
              git push origin HEAD:"$GITHUB_REF_NAME" && { echo "push ok"; exit 0; }
              sleep $((i * 4))
            done
            echo "push FAIL"
          fi

      - name: Что получилось
        if: always()
        run: |
          echo "=== data ==="
          find data -type f | sort | head -60
          echo "=== полигон ==="
          cat data/aoi.json 2>/dev/null || echo "нет aoi.json"
          echo "=== итог чеков ==="
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("data/checks.geojson")
          if not p.exists():
              print("checks.geojson — нет"); raise SystemExit
          j = json.loads(p.read_text(encoding="utf-8"))
          m = j["metadata"]
          print("чеков:", m["count"], "| га:", m["total_ha"],
                "| мин/медиана/макс:", m["min_ha"], m["median_ha"], m["max_ha"])
          print("отбраковано:", json.dumps(m.get("rejects", {}), ensure_ascii=False))
          print("признак риса:", json.dumps(m.get("rice_test", {}), ensure_ascii=False))
          print("полигон:", json.dumps(m.get("aoi", {}), ensure_ascii=False))
          PY

      - name: Журнал в задачу
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          {
            echo "### Прогон $GITHUB_RUN_ID ($GITHUB_RUN_NUMBER), шаг: $STAGE"
            echo "ветка: $GITHUB_REF_NAME, событие: $GITHUB_EVENT_NAME, время: $(date -u +%FT%TZ)"
            echo ""
            for f in find_rice weather imagery checks verify; do
              echo "#### $f (последние 60 строк)"
              tail -60 "data/_log/$f.txt" 2>/dev/null || echo "нет журнала"
              echo ""
            done
            echo "#### Файлы"
            find data -type f | sort | head -40
          } > /tmp/report.md
          gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body-file /tmp/report.md \
            && echo "журнал отправлен" || echo "issue FAIL $?"
